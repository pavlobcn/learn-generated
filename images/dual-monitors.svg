<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc">
  <title id="title">Налаштування двох моніторів</title>
  <desc id="desc">Схема двох дисплеїв у розширеному режимі з командами вибору режиму та перенесення активного вікна.</desc>
  <rect width="1160" height="390" fill="#f8fafc"/>
  <text x="580" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#102a43">Два монітори в режимі «Розширити»</text>
  <g font-family="Arial, sans-serif" fill="#102a43">
    <rect x="65" y="87" width="470" height="205" rx="12" fill="#e8f1ff" stroke="#2563a9" stroke-width="5"/>
    <rect x="625" y="112" width="470" height="205" rx="12" fill="#eaf8ef" stroke="#27864b" stroke-width="5"/>
    <text x="300" y="137" text-anchor="middle" font-size="25" font-weight="700">1 · Основний дисплей</text>
    <text x="300" y="177" text-anchor="middle" font-size="20">документ або головна програма</text>
    <text x="860" y="162" text-anchor="middle" font-size="25" font-weight="700">2 · Додатковий дисплей</text>
    <text x="860" y="202" text-anchor="middle" font-size="20">інструкція або довідкове вікно</text>
    <line x1="535" y1="202" x2="625" y2="202" stroke="#526d82" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="580" y="252" text-anchor="middle" font-size="18">Win + Shift + →</text>
    <rect x="255" y="337" width="650" height="40" rx="12" fill="#eef2f6" stroke="#526d82" stroke-width="2"/>
    <text x="580" y="364" text-anchor="middle" font-size="20"><tspan font-weight="700">Win + P</tspan> · вибір режиму: дублювати, розширити або один екран</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526d82"/></marker></defs>
</svg>
