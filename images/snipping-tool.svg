<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="360" viewBox="0 0 1160 360" role="img" aria-labelledby="title desc">
  <title id="title">Знімок і запис екрана в програмі Ножиці</title>
  <desc id="desc">Схема показує клавіатурні команди для знімка й запису, вибір області, перевірку приватних даних і збереження результату.</desc>
  <rect width="1160" height="360" fill="#f8fafc"/>
  <text x="580" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#102a43">Ножиці: знімок або запис</text>
  <g font-family="Arial, sans-serif" fill="#102a43">
    <rect x="35" y="84" width="250" height="90" rx="14" fill="#e8f1ff" stroke="#2563a9" stroke-width="3"/>
    <text x="160" y="120" text-anchor="middle" font-size="21" font-weight="700">Знімок</text>
    <text x="160" y="151" text-anchor="middle" font-size="20">Win + Shift + S</text>
    <rect x="325" y="84" width="250" height="90" rx="14" fill="#eaf8ef" stroke="#27864b" stroke-width="3"/>
    <text x="450" y="120" text-anchor="middle" font-size="21" font-weight="700">Запис</text>
    <text x="450" y="151" text-anchor="middle" font-size="20">Win + Shift + R</text>
    <rect x="615" y="84" width="230" height="90" rx="14" fill="#fff7df" stroke="#b77700" stroke-width="3"/>
    <text x="730" y="120" text-anchor="middle" font-size="21" font-weight="700">Вибрати область</text>
    <text x="730" y="151" text-anchor="middle" font-size="18">лише потрібна частина</text>
    <rect x="885" y="84" width="240" height="90" rx="14" fill="#ffecec" stroke="#b53b3b" stroke-width="3"/>
    <text x="1005" y="120" text-anchor="middle" font-size="21" font-weight="700">Перевірити</text>
    <text x="1005" y="151" text-anchor="middle" font-size="18">прибрати приватне</text>
    <path d="M285 129h40M575 129h40M845 129h40" stroke="#526d82" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="310" y="232" width="540" height="78" rx="14" fill="#eef2f6" stroke="#526d82" stroke-width="3"/>
    <text x="580" y="265" text-anchor="middle" font-size="21" font-weight="700">Переглянути результат перед надсиланням</text>
    <text x="580" y="294" text-anchor="middle" font-size="18">збережіть файл у зрозумілу папку</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526d82"/></marker></defs>
</svg>
